    register: vendor/cco/cco-register.json
    licence:
      spdx: BSD-3-Clause
      url: >-
        https://github.com/CommonCoreOntology/CommonCoreOntologies/blob/510dad76be0ef710b65a421075af912af25342b7/LICENSE
      licence_statement_contains: BSD 3-Clause
      attribution: >-
        Common Core Ontologies v2.0. Copyright (c) 2017 CUBRC, Inc.,
        licensed BSD-3-Clause.
    note: >-
      v2.0, the target of the v2.0-2024-11-06 tag, resolved through the
      GitHub API rather than taken from the tag name. The file declares
      version IRI
      https://www.commoncoreontologies.org/2024-11-06/CommonCoreOntologiesMerged.
      The same pin the Business Capability Ontology and the Business
      Process Ontology use, so terms shared between them anchor to the
      same CCO IRIs.

