# The tools that write pinned files. The checks never run them.
#
# uv resolves requirements-lock.txt (tools/lock.py --write). It is used
# for that alone: CI and a developer install with pip, from the lock, in
# hash-checking mode (template decision 32).
#
#   version        the uv release, exactly
#   sha256         every distribution PyPI publishes for that release, by
#                  file name. tools/lock.py installs uv with pip's
#                  --require-hashes against these, so pip checks the one
#                  file it downloads; tools/pins.py checks the list
#                  against PyPI's
#   python         the interpreter the lock is resolved for: the declared
#                  baseline. A run records its exact patch version
#   exclude_newer  the lock takes no release published after this
#                  instant, so the same inputs resolve to the same lock
#                  on any day. Moving it is how the transitive versions
#                  move; it is checked with the pins before a release

version: 1

