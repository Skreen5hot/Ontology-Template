# The kinds of reviewer, and the capacity a judgement is made in (P5's
# shared half, template decision 32).
#
# A review records who made it and in what capacity: when one person
# holds two roles, the record says which one they acted in. The BCO's
# conceptual model ticked "domain stakeholders have reviewed the model"
# on reviews no practitioner had made, because nothing recorded the kind.
#
# Read by the findings register and the review register: `classified_by`
# on an entry is "<name> (<kind>)", the kind one of these. P5's other
# half is tools/stages.py's review gate (backlog item 12): a stage names
# the roles that answer its review candidates, and an answer from another
# role, or from someone the charter does not name in it, does not pass.
#
# A project may add kinds, with what each means for it. It may not remove
# one of the template's: tools/findings.py refuses a file without them.
#
# The roles that answer an ontology's review are Domain Expert, Proxy
# Domain Expert and Ontologist (template decision 35); the architect and
# the rights reviewer answer for decisions and rights. v0.4.0 renamed
# domain-practitioner to domain-expert.

version: 1

kinds:
  ontologist: >-
    An ontology engineer, judging the formal modelling: placement,
    definitions, axioms, alignment with BFO and CCO.
  domain-expert: >-
    Someone with recognised expertise in the work the ontology describes,
    judging whether it says what that work is. The charter names them.
  proxy-domain-expert: >-
    Someone the charter names as standing in for a domain expert while
    none is available: experienced in the domain, without the expertise
    the project would ask of an expert. A proxy's judgement is recorded
    as a proxy's, never as an expert's, and the work goes forward on it.
    When the charter names a domain expert, the proxy's answers are
    theirs to review.
  architect: >-
    The project's decision holder, judging for the project.
  rights-reviewer: >-
    Whoever records a review of rights and provenance. It records that a
    rights review was made; it implies no legal approval and no legal
    qualification, unless that authority has been separately established
    and is recorded where it is.
