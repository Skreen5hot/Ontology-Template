# Naming conventions for authored terms, checked by the IRI linter
# (`naming_convention`) and by tools/ontology/vocabulary.py.
#
# Local names only -- the part after the namespace. Readable local names
# for new terms are this template's decision 4; these say what readable
# means here. A port that keeps an identifier scheme (P10002) widens them
# and says why (docs/PORTING.md, section 6).
# A pattern is a Python regular expression matched against the whole
# local name; null turns the check off for that kind.
#
# Labels are not checked. BFO writes them in lower case ("material
# entity"), CCO in Title Case ("Organization"); which a project follows
# is its own call, written in docs/governance/naming.md.

version: 1

#: owl:Class -- UpperCamelCase: MaintenanceAct.
classes: '^[A-Z][A-Za-z0-9]*$'

#: owl:ObjectProperty, owl:DatatypeProperty, owl:AnnotationProperty --
#: lowerCamelCase: hasMaintainer.
properties: '^[a-z][A-Za-z0-9]*$'

#: skos:Concept and skos:ConceptScheme -- codes and names both occur in
#: catalogues; letters, digits, hyphens and underscores.
concepts: '^[A-Za-z0-9][A-Za-z0-9_\-]*$'

#: owl:NamedIndividual -- not checked by default.
individuals: null

#: Scheme rules: a local-name pattern that must, or must not, sit under a
#: category through rdfs:subClassOf (T12). A project's IRI scheme, not a
#: realist rule, so none ships enabled. tools/ontology/validate.py gates
#: them under `where: naming`. Each:
#:   id                  a name for the rule, in its findings
#:   pattern             matched against the whole local name
#:   must_sit_under      a class IRI, or
#:   must_not_sit_under  a class IRI (exactly one of the two)
#:   severity            violation | warning
#:   why                 one sentence
#: For example, a scheme minting `P<number>` for process types only:
#:   - id: process-ids-are-processes
#:     pattern: 'P[0-9]+'
#:     must_sit_under: http://purl.obolibrary.org/obo/BFO_0000015
#:     severity: violation
#:     why: A P-number names a process type.
scheme_rules: []
