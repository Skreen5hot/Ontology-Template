# The checks that run on every push and pull request.
#
# Carried from the Business Capability Ontology, which carried it from the
# Application Requirement Ontology. Owned by the ontology template, so it
# names no project: every value it needs comes from config/project.yaml
# through the tools it runs.
#
# Every check step runs whatever the steps before it did, and the last
# step fails the job, naming every check that failed. The Business Process
# Ontology port found why: the job stopped at its first failure, so one
# accepted IRI-lint finding hid the seven checks after it, and they were
# run by hand or not at all. A check step is marked continue-on-error and
# given an id; tests/test_findings.py fails on one that is not.
#
# Actions are pinned to commit SHAs. A tag can be moved to a different
# commit; a commit cannot. Everything else in this repository pins
# exactly, and a supply chain is a strange place to make an exception.
#
# fetch-depth is 0 because history-dependent checks exist: the
# communications check counts the commits that touched a message, and a
# shallow clone would see one.

name: Checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    # Weekly, for the one job that needs the network. Nothing here should
    # change on its own -- the upstream urls name commits -- so a failure
    # is a real finding: a moved artifact, a rewritten history, or a
    # repository that has gone away.
    - cron: '19 6 * * 1'

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Contract, licensing, tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out the full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'

      - name: Install the pinned dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
          python -m pip list

      # First, because everything after it would otherwise pass in a copy
      # of the template that was never set up -- every check green, about
      # a placeholder ontology called `example`.
      - name: This is a project, not an uninitialized copy of the template
        id: project
        continue-on-error: true
        run: python tools/project.py --check

      - name: The layout contract describes the tree
        id: layout
        continue-on-error: true
        run: python tools/layout.py

      - name: Every tracked file has exactly one disposition
        id: disposition
        continue-on-error: true
        run: python tools/licensing/disposition.py

      - name: Nothing unpublishable is tracked
        id: publishable
        continue-on-error: true
        run: python tools/licensing/disposition.py --check

      - name: The vendored extracts cover what the corpus and shapes name
        id: extracts
        continue-on-error: true
        run: python tools/ontology/vendor_upstream.py

      # Every finding a check accepts rather than fails on, one entry each,
      # with a reason, an owner and a review date. A malformed entry fails
      # here, once, rather than in each check that reads it.
      - name: The findings register can be used
        id: register
        continue-on-error: true
        run: python tools/findings.py

      # The SHACL ladder, gated through config/findings-register.yaml: a
      # violation or warning no entry accepts fails, and so does an entry
      # that matches nothing.
      - name: No new ontology findings
        id: validate
        continue-on-error: true
        run: python tools/ontology/validate.py --gate

      # Every upstream IRI is a term of its pinned release, every authored
      # one is declared. A file that does not parse fails here (exit 2),
      # never passes as a file with nothing wrong in it.
      - name: Every IRI is a real term or a declared one
        id: iri_lint
        continue-on-error: true
        run: python tools/ontology/iri_lint.py

      # What the ontology must be able to answer. A fresh project has no
      # questions, and says so; an answerable question with a wrong answer
      # fails here.
      - name: Every answerable competency question gives its answer
        id: competency
        continue-on-error: true
        run: python tools/ontology/competency.py

      - name: Every crosswalk holds
        id: mappings
        continue-on-error: true
        run: python tools/ontology/mappings.py

      - name: The generated vocabulary, shapes and Protégé files are current
        id: generated
        continue-on-error: true
        run: |
          python tools/ontology/vocabulary.py --check
          python tools/ontology/profile_shapes.py --check
          python tools/ontology/protege.py --check

      - name: Modules declared canonical are in canonical form
        id: canonical
        continue-on-error: true
        run: python tools/ontology/normalize.py --check

      - name: The communications record follows its protocol
        id: communications
        continue-on-error: true
        run: python tools/communications.py

      # In the template, a stale manifest fails. In a project it reports
      # where the project has diverged from the template, and passes.
      - name: Where this has diverged from the template
        id: template_status
        continue-on-error: true
        run: python tools/template_status.py --check

      # The site the Pages job would deploy, built and checked here, so
      # that what the build refuses -- a fragment no page names, an asset
      # with no rule, a CRLF source -- fails a pull request rather than a
      # deploy. It refuses nothing about the ontology's content, which
      # the ladder gates (tools/site/build_site.py says why).
      - name: The site builds and passes its own check
        id: site
        continue-on-error: true
        run: |
          python tools/site/build_site.py -o "$RUNNER_TEMP/site"
          python tools/site/check_site.py "$RUNNER_TEMP/site"

      # Everything but the tests that need Java and ROBOT, which the
      # Reasoning workflow runs. Deselected by marker, named here, rather
      # than skipped where they stand: a skip reads as a pass.
      - name: Tests
        id: tests
        continue-on-error: true
        run: python -m pytest tests/ -q -p no:randomly -m "not reasoning and not scale and not corpus"

      # The job's verdict. Runs whatever happened above, and fails if any
      # check step did not succeed, listing each one -- a step skipped
      # because setup failed is listed too, never read as a pass.
      - name: Every check passed
        if: always()
        env:
          STEPS: ${{ toJSON(steps) }}
        run: |
          python - <<'PY'
          import json, os, sys
          steps = json.loads(os.environ["STEPS"])
          bad = [(name, s["outcome"]) for name, s in steps.items()
                 if s["outcome"] != "success"]
          for name, outcome in steps.items():
              print("  %-16s %s" % (name, outcome["outcome"]))
          if bad:
              print("\n%d check(s) did not pass: %s" % (
                  len(bad), ", ".join("%s (%s)" % b for b in bad)))
              sys.exit(1)
          print("\nevery check passed")
          PY

  vendored:
    # The check the offline one cannot make: that the committed extracts
    # are what rebuilding from the pinned upstreams produces, rather than
    # files that were once generated and have been edited since.
    #
    # Separate because it needs the network. Folding it into the job
    # above would make every pull request depend on external hosts being
    # up, and a check that fails for reasons unrelated to the change is a
    # check people learn to re-run rather than read.
    name: Extracts still rebuild from the pinned sources
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'

      - name: Install the pinned dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Fetch the pinned upstreams and compare
        run: python tools/ontology/vendor_upstream.py --confirm
