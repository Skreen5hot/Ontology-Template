# Reasoning: consistency and unsatisfiable classes, with the full upstreams.
#
# A job of its own (template decision 2), because it needs Java and a
# pinned ROBOT jar, and the checks every push runs stay Python-only. It
# reasons over the authored modules plus the FULL pinned BFO and CCO --
# not the extracts -- then, when there are examples, checks the example
# instance data is consistent with them.
#
# The Java version and the ROBOT pin are read from config/reasoning.yaml
# rather than repeated here; the jar and the upstream files are cached,
# keyed on the files that pin them, so a cache hit is the same bytes the
# digests require.
#
# Actions are pinned to commit SHAs, resolved from the GitHub API: cache
# v6.1.0 (2026-10-23), setup-java v6.1.0 (Dependabot's #3, checked and
# merged 2026-10-24), and the checkout and setup-python the Checks
# workflow uses.

name: Reasoning

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: reasoning-${{ github.ref }}
  cancel-in-progress: true

jobs:
  reason:
    name: Consistent, nothing unsatisfiable (ROBOT, ELK)
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Install the pinned dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Read the Java version the reasoner is pinned with
        id: pins
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import yaml
          print("java=%s" % yaml.safe_load(open("config/reasoning.yaml"))["java"])
          PY

      - name: Set up Java
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: ${{ steps.pins.outputs.java }}

      - name: Cache the pinned jar and upstream files
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .tool-cache
            .upstream-cache
          key: pinned-${{ hashFiles('config/reasoning.yaml', 'config/upstream-sources.yaml') }}

      - name: Consistent, and nothing unsatisfiable
        run: python tools/ontology/reason.py

      - name: The reasoning tests
        run: python -m pytest tests/ -q -p no:randomly -m reasoning
