# Install: the one dependency lock, installed fresh on Linux, Windows and
# macOS.
#
# requirements-lock.txt is resolved once for every platform (tools/lock.py),
# and a universal resolution is not proof that each platform installs it
# (template decision 32). So each runner here starts from an empty
# interpreter, installs the pinned pip and then the lock in hash-checking
# mode, checks the installed set is consistent, resolves the lock again
# with the pinned uv and compares it byte for byte, and runs the
# validation ladder, which loads every library the checks use.
#
# Weekly as well, because what can break an unchanged lock is on PyPI's
# side: a yanked release, or a file removed.
#
# Actions are pinned to the commit SHAs the Checks workflow uses.

name: Install

on:
  schedule:
    - cron: '41 4 * * 1'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'requirements-dev.txt'
      - 'requirements-pip.txt'
      - 'requirements-lock.txt'
      - 'config/tooling.yaml'
      - 'tools/lock.py'
      - '.github/workflows/install.yml'
  pull_request:
    paths:
      - 'requirements-dev.txt'
      - 'requirements-pip.txt'
      - 'requirements-lock.txt'
      - 'config/tooling.yaml'
      - 'tools/lock.py'
      - '.github/workflows/install.yml'

permissions:
  contents: read

concurrency:
  group: install-${{ github.ref }}
  cancel-in-progress: true

jobs:
  install:
    name: Fresh install from the lock (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-15]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'

      # Prints the interpreter and both pip versions: the run's record of
      # what it ran on.
      - name: Install the pinned pip
        run: python tools/lock.py --bootstrap

      - name: Install the lock, every file checked against its hash
        run: |
          python -m pip install --disable-pip-version-check --require-hashes -r requirements-lock.txt
          python -m pip list

      - name: The installed set is consistent
        run: python -m pip check

      - name: The lock resolves again to the same bytes
        run: python tools/lock.py --verify

      - name: The libraries the checks use load and run
        run: |
          python tools/ontology/vendor_upstream.py
          python tools/ontology/validate.py --gate
          python -m pytest tests/test_lock.py -q -p no:randomly
