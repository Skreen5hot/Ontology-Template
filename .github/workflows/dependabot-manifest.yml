# Dependabot in the template: re-record the template manifest on its pull
# requests, so they are judged on what they change.
#
# The workflows and requirements-dev.txt are template-owned, and
# config/template-manifest.json records their digests. A Dependabot pin
# bump changes one of them, so in the template every Dependabot pull
# request failed Checks with STALE -- the manifest no longer described the
# files -- whatever the new version did. Dependabot cannot run
# `tools/template_status.py --record`; this does, and nothing else.
#
# WHAT IT DOES
#
#   1. Runs only for Dependabot: the pull request's author and the actor
#      of this event are both dependabot[bot]. A person pushing to the
#      branch is the actor, and this does not run.
#   2. Only in the template. In a project, divergence from the template is
#      reported, not refused, and there is nothing to re-record.
#   3. Re-records the manifest, and refuses to push if any file other than
#      config/template-manifest.json changed.
#   4. Pushes that one-file commit to the Dependabot branch, and starts the
#      Checks, Reasoning and Pages workflows on it by hand. A push made with this
#      job's token starts no workflow -- GitHub's guard against loops --
#      and workflow_dispatch is the documented exception. Without it the
#      pull request would go on showing the old commit's failure.
#
# It does not approve or merge anything, and it does not make a broken
# update pass: Checks, Reasoning and Pages run in full on the new commit.
# Pages dispatched on a branch builds and checks; it deploys from main
# only.
#
# PERMISSIONS
#
# Dependabot-triggered pull_request workflows get a read-only token unless
# the workflow asks for more. This asks for contents: write (the one
# commit) and actions: write (the dispatch), in this job only.
#
# Actions pinned to commit SHAs, the same ones the Checks workflow uses.

name: Dependabot manifest

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: dependabot-manifest-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  rerecord:
    name: Re-record the template manifest for Dependabot
    if: >-
      github.event.pull_request.user.login == 'dependabot[bot]' &&
      github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - name: Check out the Dependabot branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'

      - name: Install the pinned dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Is this the template, and is its manifest stale?
        id: state
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import sys
          sys.path.insert(0, "tools")
          import project
          print("template=%s" % str(project.is_template()).lower())
          PY
          # The log goes outside the checkout: an untracked file in it would
          # show in `git status`, and the one-file guard below would refuse.
          if python tools/template_status.py --check > "$RUNNER_TEMP/status.log" 2>&1; then
            echo "stale=false" >> "$GITHUB_OUTPUT"
          else
            echo "stale=true" >> "$GITHUB_OUTPUT"
          fi
          cat "$RUNNER_TEMP/status.log"

      - name: Re-record, and refuse anything but the manifest
        id: record
        if: steps.state.outputs.template == 'true' && steps.state.outputs.stale == 'true'
        run: |
          python tools/template_status.py --record --label "unreleased"
          changed=$(git status --porcelain | awk '{print $2}' | sort)
          echo "changed: $changed"
          if [ "$changed" != "config/template-manifest.json" ]; then
            echo "Refusing: re-recording changed more than the manifest." >&2
            exit 1
          fi
          python tools/template_status.py --check

      - name: Push the one-file commit
        if: steps.record.outcome == 'success'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add config/template-manifest.json
          git commit -m "Re-record the template manifest for this Dependabot update" \
            -m "The workflows and requirements-dev.txt are template-owned; this pin change made config/template-manifest.json stale. Re-recorded by .github/workflows/dependabot-manifest.yml, which changes nothing else."
          git push origin "HEAD:${{ github.head_ref }}"

      - name: Run Checks, Reasoning and Pages on the new commit
        if: steps.record.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run checks.yml --ref "${{ github.head_ref }}"
          gh workflow run reasoning.yml --ref "${{ github.head_ref }}"
          gh workflow run pages.yml --ref "${{ github.head_ref }}"
