# Scale: the checks within their time budgets, on a corpus a real size.
#
# The Business Process Ontology port found that the template's checks were
# built and timed on a module with no terms: at 3,119 classes the
# validation ladder did not finish in two hours, and a release build had
# not finished in five. tests/test_scale.py's `scale` tests run the ladder
# and two release builds over tools/ontology/benchmark.py's corpus -- a
# little larger than BPO, with a planted defect per check -- and fail when
# a budget is exceeded or a planted defect is missed. The budgets are
# decision 11's: 15 minutes each, on this runner.
#
# A job of its own, because it takes minutes and the Checks job should
# not. It runs weekly, by hand, and on any pull request that changes what
# it measures: the tools, the shapes, the pins.
#
# Actions pinned to commit SHAs, the same ones the Checks workflow uses.

name: Scale

on:
  schedule:
    - cron: '17 4 * * 1'
  workflow_dispatch:
  pull_request:
    paths:
      - 'tools/**'
      - 'shapes/**'
      - 'requirements-dev.txt'
      - 'config/upstream-sources.yaml'
      - 'vendor/**'

permissions:
  contents: read

concurrency:
  group: scale-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scale:
    name: Ladder and release within budget on the benchmark
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'

      - name: Install the pinned dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: The budgets, and the corpus-sized tests, with each test's time
        run: python -m pytest tests/ -q -p no:randomly -m "scale or corpus" --durations=0
